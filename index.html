<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Ventas</title>
  </head>
  <body>
    <h1>Totalizador de Ventas</h1>
    <form id="totalizar-form">
      <label for="cantidad-items">Cantidad de Items:</label>
      <input type="number" id="cantidad-items" />
      <label for="precio-unitario">Precio unitario:</label>
      <input type="number" id="precio-unitario" />
      <label for="codigo-estado">Código de estado:</label>
      <select id="codigo-estado"></select>
      <input type="submit" value="Totalizar" id="totalizar-button" />
    </form>
    <div id="precio-neto"></div>
    <div id="descuento-aplicado"></div>
    <div id="impuesto-aplicado"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
